name: Update DevCard

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "45 23 * * 0"

jobs:
  devcard:
    runs-on: ubuntu-latest
    steps:
      - name: devcard
        uses: dailydotdev/action-devcard@958db5a3e058fa60678968743b17214f7fc03a4b # 3.2.1
        with:
          user_id: ${{ secrets.USER_ID }}
          commit_message: "chore: update ${filename}"
